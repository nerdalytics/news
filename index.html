<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>TheNews</title>
		<meta
			name="description"
			content="TheNews shows the top 20 entries of Hacker News, GitHub and other developer sources on one page."
		/>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1012" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="TheNews" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Apply the stored theme before the first paint, so the page does not flash in the wrong theme.
			;(() => {
				const stored = /(?:^|; )thenews_theme=(light|dark)/.exec(document.cookie)
				if (stored) document.documentElement.dataset.theme = stored[1]
			})()
		</script>
		<style>
			/* Inline styles for the theme and the splash, which render before the stylesheet loads. */
			:root {
				color-scheme: light dark;
			}
			:root[data-theme='light'] {
				color-scheme: light;
			}
			:root[data-theme='dark'] {
				color-scheme: dark;
			}
			body {
				margin: 0;
				background: light-dark(#ffffff, #0f1012);
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-items: center;
				background: light-dark(#ffffff, #0f1012);
			}
			#splash.is-done {
				opacity: 0;
				visibility: hidden;
			}
			/* Motion is opt-in, matching the stylesheet. Without it the splash shows and hides instantly. */
			@media (prefers-reduced-motion: no-preference) {
				#splash {
					transition:
						opacity 0.18s ease,
						visibility 0.18s;
				}
				/* The mark fades in after 150 ms, so a fast load never shows it. */
				#splash svg {
					opacity: 0;
					animation: splash-in 0.2s 0.15s ease forwards;
				}
			}
			@keyframes splash-in {
				to {
					opacity: 1;
				}
			}
		</style>
		<link rel="stylesheet" href="/src/styles.css" />
	</head>
	<body>
		<div id="splash" aria-hidden="true">
			<svg viewBox="0 0 64 64" width="56" height="56">
				<rect width="64" height="64" rx="15" fill="#f0652f" />
				<path d="M18 22h28M18 32h20M18 42h12" stroke="#fff" stroke-width="6" stroke-linecap="round" />
			</svg>
		</div>
		<header class="bar">
			<nav id="tabs" class="tabs" aria-label="Sources"></nav>
			<button id="manage" class="icon-btn" type="button" aria-label="Manage sources">
				<svg
					viewBox="0 0 24 24"
					width="22"
					height="22"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					aria-hidden="true"
				>
					<path d="M4 7h8M18 7h2M4 17h2M12 17h8" />
					<circle cx="15" cy="7" r="2.5" />
					<circle cx="9" cy="17" r="2.5" />
				</svg>
			</button>
		</header>
		<main id="deck" class="deck"></main>
		<noscript>
			<p style="padding: 24px; font-family: system-ui, sans-serif">
				TheNews fetches its feeds in your browser, so it needs JavaScript.
			</p>
		</noscript>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
