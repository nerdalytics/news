name: "Source: Product Hunt"

# Once an hour. Needs the repository secret PRODUCTHUNT_TOKEN.
on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    uses: ./.github/workflows/hosted-source.yml
    with:
      source: producthunt
    secrets:
      PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
